function login(e){e.preventDefault();let u=document.getElementById('loginName').value.trim(),p=document.getElementById('loginPass').value,fio=document.getElementById('loginFio').value.trim(),group=document.getElementById('loginGroup').value.trim();if(u==='student'&&p==='student'&&fio&&group){db.studentFio=fio;db.studentGroup=group;sessionStorage.setItem('praktikum_auth','1');sessionStorage.setItem('praktikum_fio',fio);sessionStorage.setItem('praktikum_group',group);save();document.getElementById('auth').style.display='none';render();toast('Добро пожаловать, '+fio);return false}document.getElementById('authError').textContent='Проверьте логин, пароль, ФИО и учебную группу';return false}function logout(){sessionStorage.removeItem('praktikum_auth');location.reload()}function setRole(r){db.role=r;save();page='Обзор';render()}function navigate(p){page=p;selectedTask=null;render()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function badge(s){let cls=s==='Выполнено'||s==='Проверено'||s==='Активен'?'':s==='Выполняется'||s==='Ожидает проверки'?'blue':s==='Не начато'?'gray':s==='Просрочено'||s==='Ошибка'?'red':'amber';return `<span class="badge ${cls}">${esc(s)}</span>`}function toast(m){let el=document.createElement('div');el.className='toast';el.textContent=m;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('praktikum_theme',document.body.classList.contains('dark')?'dark':'light')}function toggleNotices(){let x=document.getElementById('noticePanel');if(x)x.remove();else{let logs=db.logs.slice(-6).reverse();let d=document.createElement('div');d.id='noticePanel';d.className='notice-panel';d.innerHTML='<h3>Уведомления</h3>'+(logs.length?logs.map(x=>`<div class="notice">${esc(x.text)}<small>${esc(x.time)}</small></div>`).join(''):'<div class="empty">Нет новых уведомлений</div>');document.body.append(d)}}function render(){if(sessionStorage.getItem('praktikum_fio'))db.studentFio=sessionStorage.getItem('praktikum_fio');if(sessionStorage.getItem('praktikum_group'))db.studentGroup=sessionStorage.getItem('praktikum_group');if(db.tasks.length>lastTaskCount){let fresh=db.tasks[db.tasks.length-1];notifyNewTask(fresh);lastTaskCount=db.tasks.length;localStorage.setItem('praktikum_task_count',lastTaskCount)}document.getElementById('roleSelect').value=db.role;document.getElementById('sideRole').textContent=db.role;document.getElementById('sideName').textContent=db.role==='Студент'?(db.studentFio||'Студент'):db.role==='Преподаватель'?'Дмитрий Волков':'Администратор';document.getElementById('sideAvatar').textContent=db.role==='Студент'?((db.studentFio||'Студент').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()):db.role==='Преподаватель'?'ДВ':'АД';document.getElementById('crumb').textContent=selectedTask?'Рабочая область':page;document.getElementById('nav').innerHTML=navItems[db.role].map(([n,i])=>`<button class="${page===n?'active':''}" onclick="navigate('${n}')"><span class="ico">${i}</span><span>${n}</span></button>`).join('');let ident=db.role==='Студент'?(db.studentFio||'Студент'):db.role;document.getElementById('topIdentity').textContent=ident;document.getElementById('topAvatar').textContent=ident.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();document.getElementById('mobileNav').innerHTML=navItems[db.role].slice(0,4).map(([n,i])=>`<button onclick="navigate('${n}')">${i}<small>${n}</small></button>`).join('');document.getElementById('app').innerHTML=selectedTask?workspace(selectedTask):page==='Обзор'?dashboard():page==='Мои задания'||page==='Задания и шаблоны'?taskCatalog():page==='Проверка работ'?reviews():page==='История попыток'?historyPage():page==='Пользователи'?usersPage():page==='Стенды'?standsPage():page==='Системный журнал'?systemLog():page==='Группы'?groupsPage():dashboard()}
function head(title,sub,button=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${button?`<div class="actions">${button}</div>`:''}</div>`}
function dashboard(){let teacher=db.role==='Преподаватель',admin=db.role==='Администратор';let title=teacher?'Панель преподавателя':admin?'Панель администратора':`Добро пожаловать, ${esc(db.studentFio||'студент')}`;let subtitle=teacher?'Управляйте заданиями и проверяйте работы студентов.':admin?'Состояние платформы и управление доступом.':'Ваш учебный прогресс и практические задания.';let stats=teacher?[['Назначено заданий','12','↑ 3 в этом месяце','▤'],['На проверке',db.attempts.filter(a=>a.status==='Ожидает проверки').length+3,'Требуют внимания','◷'],['Студентов','48','В 3 учебных группах','♙'],['Средний балл','82%','↑ 4% к прошлому месяцу','⌁']]:admin?[['Пользователей',db.users.length,'Все учётные записи','♙'],['Активные стенды','8','Из 12 доступных','▦'],['Ожидают проверки','3','В системе','◷'],['Состояние платформы','Норма','Все сервисы работают','✓']]:[['Активные задания','2','Из 3 назначенных','▤'],['Завершено','1','В этом курсе','✓'],['Средний балл','84%','Выше среднего на 6%','⌁'],['До ближайшего срока','Сегодня','Настройка сети · 18:00','◷']];let taskBlock=teacher?`<div class="card section"><div class="sectiontitle"><h3>Последние работы</h3><button class="textlink" onclick="navigate('Проверка работ')">Все работы →</button></div>${reviewList(3)}</div>`:admin?`<div class="card section"><div class="sectiontitle"><h3>Состояние стендов</h3><button class="textlink" onclick="navigate('Стенды')">Открыть панель →</button></div>${['lab-ubuntu-01','lab-cisco-04','lab-ubuntu-09'].map((x,i)=>`<div class="checkrow"><span>${x} · ${['Студент: И. Морозов','Свободен','Студент: А. Кузнецова'][i]}</span>${badge(i===1?'Остановлен':'Активен')}</div>`).join('')}</div>`:`<div class="card section"><div class="sectiontitle"><h3>Ближайшие задания</h3><button class="textlink" onclick="navigate('Мои задания')">Все задания →</button></div><div class="tasklist">${db.tasks.slice(0,2).map(taskCard).join('')}</div></div>`;return `${head(title,subtitle,teacher?`<button class="btn primary" onclick="openTaskModal()">＋ Создать задание</button>`:'')}<div class="grid stats">${stats.map(x=>`<div class="card stat"><div class="statrow"><span>${x[0]}</span><span class="staticon">${x[3]}</span></div><div class="statnum">${x[1]}</div><div class="delta">${x[2]}</div></div>`).join('')}</div><div class="grid twocol"><div>${taskBlock}</div><div class="card section"><div class="sectiontitle"><h3>${admin?'Системные события':'Последние события'}</h3><button class="textlink" onclick="navigate('${admin?'Системный журнал':'История попыток'}')">История →</button></div><div class="activity">${activityList()}</div></div></div>`}
function taskCard(t){return `<div class="task"><div class="taskicon">${t.topic.includes('Сет')?'⌘':'▣'}</div><div class="taskcontent"><h4>${esc(t.title)}</h4><div class="taskmeta"><span>${esc(t.topic)}</span><span>${esc(t.type)}</span><span>${t.points} баллов</span></div></div><div class="taskright">${badge(t.status)}<div class="deadline">${esc(t.due)}</div><button class="textlink" style="padding:5px 0" onclick="openWorkspace(${t.id})">${t.status==='Выполнено'?'Результат':'Открыть'} →</button></div></div>`}
let lastTaskCount=Number(localStorage.getItem('praktikum_task_count')||db.tasks.length);let soundEnabled=false;function enableSound(){soundEnabled=true;toast('Звуковые уведомления включены');}function notifyNewTask(t){toast('Новое задание: '+t.title);if(soundEnabled){let C=window.AudioContext||window.webkitAudioContext;if(C){let c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}}}function activityList(){let arr=db.logs.slice(-4).reverse();if(!arr.length)arr=['Попытка по заданию «Управление пользователями» проверена','Новый вариант задания назначен группе ИС-21','Стенд lab-ubuntu-09 запущен'];return arr.map((x,i)=>`<div class="event"><i class="eventdot"></i><div><p>${esc(typeof x==='string'?x:x.text)}</p><small>${typeof x==='string'?['Сегодня, 14:32','Сегодня, 12:15','Вчера, 16:40'][i%3]:x.time}</small></div></div>`).join('')}
function taskCatalog(){let teacher=db.role==='Преподаватель';return `${head(teacher?'Банк заданий и шаблоны':'Мои задания',teacher?`30 практических сценариев · создание, рандомизация и назначение группам.`:'Индивидуальные варианты и сроки выполнения.',teacher?'<button class="btn primary" onclick="openTaskModal()">＋ Новое задание</button>':'')}<div class="card section"><div class="filters"><input id="searchTask" placeholder="Поиск по 30 заданиям…" oninput="filterTasks()"><select id="filterState" onchange="filterTasks()"><option value="">Все статусы</option><option>Не начато</option><option>Выполняется</option><option>Выполнено</option></select><select><option>Все темы</option><option>Сети и маршрутизация</option><option>Linux-администрирование</option><option>Коммутация Cisco</option><option>Сетевые сервисы</option></select></div><div class="tasklist" id="tasklist">${db.tasks.map(taskCard).join('')}</div></div>`}
function filterTasks(){let q=document.getElementById('searchTask').value.toLowerCase(),s=document.getElementById('filterState').value;document.querySelectorAll('#tasklist .task').forEach((el,i)=>el.style.display=db.tasks[i].title.toLowerCase().includes(q)&&(!s||db.tasks[i].status===s)?'flex':'none')}
function openWorkspace(id){selectedTask=db.tasks.find(t=>t.id===id);startTimer();if(selectedTask.status==='Не начато'){selectedTask.status='Выполняется';db.logs.push({text:`Начата попытка: ${selectedTask.title}`,time:new Date().toLocaleString('ru-RU')});save()}render()}
function workspace(t){return `${head(t.title,`${t.topic} · ${t.level} уровень · ${t.points} баллов`,`<button class="btn" onclick="renderReport(${t.id})">▧ Отчёт</button><button class="btn" onclick="navigate('${db.role==='Преподаватель'?'Задания и шаблоны':'Мои задания'}')">← Назад</button>`)}<div class="workspace"><div class="card pad"><div class="tabs"><button class="tab active" onclick="switchTab(this,'taskInfo')">Условие</button><button class="tab" onclick="switchTab(this,'taskTopo')">Топология</button><button class="tab" onclick="switchTab(this,'taskGuide')">Подсказки</button></div><div id="taskInfo" class="tabbody"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center">${badge(t.status)}<span class="taskmeta">Попытка #${db.attemptCount} · Вариант индивидуальный</span></div><h3>Условие задания</h3><p>${esc(t.description)}</p><div class="card" style="padding:12px;background:#f8f9fc;border-color:#eef0f5"><b style="font-size:11px">Исходные параметры варианта</b><p style="margin:5px 0 0">${esc(t.params)}</p></div><h3>Ожидаемый результат</h3><p>Рабочая конфигурация, подтверждённая проверками, и краткое описание выполненных действий.</p><h3>Критерии оценивания</h3>${t.criteria.map((c,i)=>`<div class="checkrow"><span>${esc(c)}</span><span>${Math.round(t.points/t.criteria.length)} балл.</span></div>`).join('')}</div><div id="taskTopo" class="tabbody hidden"><h3>Схема лаборатории</h3><div class="topology"><div class="node">💻 Клиент</div><i class="link"></i><div class="node">🔀 Switch / Router</div><i class="link"></i><div class="node">🖥 Сервер</div></div><p>Изолированная сеть варианта · соединения и параметры стенда доступны во время выполнения.</p></div><div id="taskGuide" class="tabbody hidden"><h3>Подсказки</h3><div class="checkrow"><span>Подсказка 1</span><button class="textlink" onclick="toast('Проверьте адресацию и таблицу маршрутизации')">Показать</button></div><div class="checkrow"><span>Подсказка 2</span><button class="textlink" onclick="toast('После изменения конфигурации выполните проверку ping')">Показать</button></div></div><h3>Прогресс попытки <span class="timer" id="attemptTimer">45:00</span></h3><div class="progress"><i style="width:68%"></i></div><p class="taskmeta">Сохранение черновика включено · критерии проверяются после отправки</p><h3>Данные студента</h3><div class="formgrid"><div class="formrow"><label>ФИО</label><input class="field" id="studentFio" placeholder="Введите ФИО" value="${esc(db.studentFio||'')}" oninput="db.studentFio=this.value;save()"></div><div class="formrow"><label>Учебная группа</label><input class="field" id="studentGroup" placeholder="Например, ИС-21" value="${esc(db.studentGroup||'')}" oninput="db.studentGroup=this.value;save()"></div></div><h3>Ваше решение</h3><textarea id="answer" placeholder="Опишите выполненные действия, команды или конфигурацию…">${esc(t.answer||'')}</textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span class="taskmeta">Черновик сохраняется автоматически</span><button class="btn primary" onclick="submitTask(${t.id})">Отправить решение →</button></div></div><div style="display:grid;gap:15px"><div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:15px">Лабораторный стенд</h2>${badge('Активен')}</div><p>Изолированная виртуальная среда · Ubuntu Server 22.04</p><div class="terminalbar"><span>TERMINAL / SSH</span><span>● connected</span></div><div class="terminal" id="terminal">${terminalLines.map(esc).join('\n')}</div><div class="termline"><span>$</span><input id="cmd" placeholder="Введите команду…" onkeydown="if(event.key==='Enter')runCommand()"><button class="btn" onclick="runCommand()">Выполнить</button></div><div style="display:flex;gap:8px;margin-top:11px"><button class="btn" onclick="toast('Стенд перезапускается…')">↻ Перезапустить</button><button class="btn" onclick="toast('Стенд остановлен')">■ Остановить</button></div></div><div class="card pad"><h2 style="font-size:15px">Ход выполнения</h2><div class="progress"><i></i></div><div class="checkrow"><span>Попытка начата</span><span>14:02</span></div><div class="checkrow"><span>Стенд запущен</span><span>14:04</span></div><div class="checkrow"><span>Использовано подсказок</span><span>0 / ${t.hints}</span></div><button class="textlink" onclick="toast('Подсказка: проверьте таблицу маршрутизации командой ip route')">Показать подсказку (?)</button></div></div></div>`}
function switchTab(btn,id){let root=btn.closest('.pad');root.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));root.querySelectorAll('.tabbody').forEach(x=>x.classList.add('hidden'));btn.classList.add('active');root.querySelector('#'+id).classList.remove('hidden')}function runCommand(){let input=document.getElementById('cmd'),cmd=input.value.trim();if(!cmd)return;let out=cmd==='help'?'Доступные команды: ip addr, ip route, ping, systemctl status, clear':cmd==='ip addr'?'2: eth0: <UP> inet 192.168.14.21/24\n3: eth1: <UP> inet 10.24.6.21/24':cmd==='ip route'?'default via 192.168.14.1 dev eth0\n10.24.6.0/24 dev eth1':cmd.startsWith('ping')?'PING: 4 packets transmitted, 4 received, 0% packet loss':cmd==='clear'?'':'Команда выполнена. (Демо-стенд: результат симулирован)';if(cmd==='clear')terminalLines=[];else terminalLines.push('$ '+cmd,out);document.getElementById('terminal').textContent=terminalLines.join('\n');input.value='';db.logs.push({text:`Команда: ${cmd}`,time:new Date().toLocaleString('ru-RU')});save()}
function startTimer(){if(window.taskTimer)return;let end=Date.now()+45*60*1000;window.taskTimer=setInterval(()=>{let el=document.getElementById('attemptTimer');if(!el)return;let n=Math.max(0,end-Date.now()),m=Math.floor(n/60000),s=Math.floor(n/1000)%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(!n){clearInterval(window.taskTimer);toast('Время попытки истекло')}} ,1000)}function submitTask(id){let t=db.tasks.find(x=>x.id===id);t.answer=document.getElementById('answer').value;t.status='Ожидает проверки';let fio=(document.getElementById('studentFio')?.value||db.studentFio||'Студент').trim(),group=(document.getElementById('studentGroup')?.value||db.studentGroup||'Без группы').trim();db.studentFio=fio;db.studentGroup=group;let a={id:Date.now(),student:fio,group,task:t.title,date:new Date().toLocaleString('ru-RU'),status:'Ожидает проверки',score:null,max:t.points,comment:'',answer:t.answer,events:[...terminalLines]};db.attempts.unshift(a);db.attemptCount++;db.logs.push({text:`Решение отправлено: ${t.title}`,time:new Date().toLocaleString('ru-RU')});save();toast('Решение отправлено. Отчёт сформирован.');selectedTask=null;page='История попыток';render()}
function reviewList(limit=20){return `<div class="tablewrap"><table class="table"><thead><tr><th>Студент</th><th>Задание</th><th>Отправлено</th><th>Статус</th><th></th></tr></thead><tbody>${db.attempts.slice(0,limit).map(a=>`<tr><td><b>${esc(a.student)}</b><br><span style="color:#8791a6">${esc(a.group||'Без группы')}</span></td><td>${esc(a.task)}</td><td>${esc(a.date)}</td><td>${badge(a.status)}</td><td><button class="btn soft" onclick="openReview(${a.id})">Проверить →</button></td></tr>`).join('')}</tbody></table></div>`}
function reviews(){return `${head('Проверка работ','Просматривайте попытки, результаты тестов и историю действий.')}<div class="card section"><div class="filters"><input placeholder="Поиск студента или задания…"><select><option>Все статусы</option><option>Ожидает проверки</option><option>Проверено</option></select><select><option>Все группы</option><option>ИС-21</option><option>ИС-22</option></select></div>${reviewList()}</div>`}
function openReview(id){let a=db.attempts.find(x=>x.id===id);document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Проверка работы</h2><p class="sub">${esc(a.student)} · ${esc(a.task)} · ${esc(a.date)}</p><h3 style="font-size:13px">Ответ студента</h3><div class="card" style="padding:12px;white-space:pre-wrap;font-size:12px">${esc(a.answer||'Настроил сеть, проверил связность узлов.')}</div><h3 style="font-size:13px">Журнал действий</h3><div class="card" style="padding:12px;font-size:11px">${(a.events||['Попытка начата','Стенд запущен','Решение отправлено']).map(esc).join('<br>')}</div><div class="formgrid" style="margin-top:12px"><div class="formrow"><label>Итоговый балл (макс. ${a.max})</label><input id="score" type="number" min="0" max="${a.max}" value="${a.score??Math.round(a.max*.84)}"></div><div class="formrow"><label>Статус</label><select id="gradeStatus"><option>Проверено</option><option>Частично выполнено</option><option>Невыполнено</option></select></div><div class="formrow full"><label>Комментарий преподавателя</label><textarea id="comment">${esc(a.comment||'')}</textarea></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="gradeAttempt(${a.id})">Сохранить оценку</button></div></div></div>`}
function gradeAttempt(id){let a=db.attempts.find(x=>x.id===id);a.score=Number(document.getElementById('score').value);a.comment=document.getElementById('comment').value;a.status=document.getElementById('gradeStatus').value==='Проверено'?'Проверено':document.getElementById('gradeStatus').value;a.gradedBy='Дмитрий Волков';a.gradedAt=new Date().toLocaleString('ru-RU');db.logs.push({text:`Оценка изменена: ${a.student} · ${a.score}/${a.max}`,time:a.gradedAt});save();closeModal();render();toast('Оценка сохранена. PDF-отчёт обновлён.')}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
function historyPage(){return `${head('История попыток','Все отправленные решения, результаты проверки и PDF-отчёты.')}<div class="card section">${db.attempts.length?reviewList():`<div class="empty">Попыток пока нет. Начните с любого активного задания.</div>`}</div>`}
function renderReport(taskId){let t=db.tasks.find(x=>x.id===taskId),a=db.attempts.find(x=>x.task===t.title),id=a?.id||'DRAFT-'+Date.now();let w=window.open('','_blank');if(!w){toast('Разрешите всплывающие окна для печати PDF');return}w.document.write(`<html lang="ru"><meta charset="utf-8"><title>Отчёт по попытке ${id}</title><style>body{font:14px Arial,sans-serif;color:#172033;margin:35px}h1{font-size:22px}h2{font-size:16px;margin-top:25px;border-bottom:1px solid #ddd;padding-bottom:7px}.meta{color:#566;font-size:12px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd;padding:8px;text-align:left;font-size:12px}pre{white-space:pre-wrap;background:#f3f5f8;padding:12px}footer{position:fixed;bottom:10px;font-size:10px;color:#777}@media print{body{margin:18mm}}</style><h1>Отчёт по практической работе</h1><p class="meta">ID отчёта: ${id} · Версия ${a?.gradedAt?'2':'1'} · Сформирован ${new Date().toLocaleString('ru-RU')}</p><table><tr><th>Студент</th><td>${a?.student||db.studentFio||'Студент'} · ${a?.group||db.studentGroup||'Без группы'}</td><th>Попытка</th><td>${a?1:'Текущая'}</td></tr><tr><th>Задание</th><td>${t.title}</td><th>Тема</th><td>${t.topic}</td></tr><tr><th>Вариант</th><td colspan="3">${t.params}</td></tr><tr><th>Статус</th><td>${a?.status||t.status}</td><th>Оценка</th><td>${a?.score!=null?a.score+' / '+a.max:'Ожидает проверки'}</td></tr><tr><th>Время</th><td colspan="3">${a?.date||'Выполнение продолжается'}</td></tr></table><h2>Критерии и результаты</h2><table><tr><th>Критерий</th><th>Максимум</th><th>Результат</th></tr>${t.criteria.map(c=>`<tr><td>${c}</td><td>${Math.round(t.points/t.criteria.length)}</td><td>${a?.score!=null?'Проверено':'Ожидает проверки'}</td></tr>`).join('')}</table><h2>Ответ студента</h2><pre>${a?.answer||t.answer||'Не отправлено'}</pre><h2>Журнал действий</h2><pre>${(a?.events||terminalLines).join('\n')}</pre><h2>Обратная связь преподавателя</h2><p>${a?.comment||'Проверка преподавателем ещё не выполнена.'}</p><footer>Сформировано платформой Практикум · Секреты и пароли в отчёт не включаются.</footer><script>setTimeout(()=>window.print(),500)<\/script></html>`);w.document.close()}
function openTaskModal(){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Новое задание</h2><div class="formgrid"><div class="formrow full"><label>Название</label><input id="newTitle" placeholder="Например, настройка DNS-сервера"></div><div class="formrow"><label>Учебная тема</label><input id="newTopic" placeholder="Linux-сервисы"></div><div class="formrow"><label>Уровень сложности</label><select id="newLevel"><option>Начальный</option><option>Средний</option><option>Продвинутый</option></select></div><div class="formrow"><label>Тип среды</label><input id="newType" value="Ubuntu Server"></div><div class="formrow"><label>Максимум баллов</label><input id="newPoints" type="number" value="100"></div><div class="formrow full"><label>Условие задания</label><textarea id="newDesc" placeholder="Опишите задачу, ограничения и ожидаемый результат"></textarea></div><div class="formrow full"><label>Параметры варианта</label><input id="newParams" placeholder="IP, VLAN, имена устройств — поддерживается шаблонная рандомизация"></div><div class="formrow full"><label>Критерии (каждый с новой строки)</label><textarea id="newCriteria">Корректность конфигурации\nПроверка результата\nОписание решения</textarea></div><div class="formrow"><label>Назначить группе</label><select id="newGroup"><option>ИС-21</option><option>ИС-22</option><option>Все группы</option></select></div><div class="formrow"><label>Срок сдачи</label><input id="newDue" type="date"></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Сохранить черновик</button><button class="btn primary" onclick="createTask()">Опубликовать и назначить</button></div></div></div>`}
function createTask(){let title=document.getElementById('newTitle').value.trim();if(!title){toast('Введите название задания');return}let t={id:Date.now(),title,topic:document.getElementById('newTopic').value||'Практикум',level:document.getElementById('newLevel').value,type:document.getElementById('newType').value,status:'Не начато',due:document.getElementById('newDue').value||'Без срока',points:Number(document.getElementById('newPoints').value)||100,description:document.getElementById('newDesc').value||'Практическое задание. Выполните настройку и опишите результат.',params:document.getElementById('newParams').value||'Индивидуальный вариант генерируется при назначении',criteria:document.getElementById('newCriteria').value.split('\n').filter(Boolean),hints:2};db.tasks.unshift(t);db.logs.push({text:`Создано и назначено задание: ${title}`,time:new Date().toLocaleString('ru-RU')});save();closeModal();page='Задания и шаблоны';render();toast('Задание опубликовано и назначено группе')}
function usersPage(){return `${head('Пользователи и группы','Управление учётными записями, ролями и доступом.',`<button class="btn primary" onclick="addUser()">＋ Добавить пользователя</button>`)}<div class="card section"><div class="filters"><input placeholder="Поиск по имени или email…"><select><option>Все роли</option><option>Студент</option><option>Преподаватель</option></select><select><option>Все группы</option><option>ИС-21</option><option>ИС-22</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Пользователь</th><th>Группа</th><th>Роль</th><th>Статус</th><th>Действия</th></tr></thead><tbody>${db.users.map((u,i)=>`<tr><td><b>${esc(u.name)}</b><br><span style="color:#8791a6">${esc(u.email)}</span></td><td>${esc(u.group)}</td><td>${esc(u.role)}</td><td>${badge(u.active?'Активен':'Заблокирован')}</td><td><button class="btn" onclick="toggleUser(${i})">${u.active?'Заблокировать':'Разблокировать'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function toggleUser(i){db.users[i].active=!db.users[i].active;db.logs.push({text:`${db.users[i].active?'Разблокирована':'Заблокирована'} учётная запись ${db.users[i].name}`,time:new Date().toLocaleString('ru-RU')});save();render();toast('Изменение записано в системный журнал')}
function addUser(){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>Добавить пользователя</h2><div class="formgrid"><div class="formrow"><label>Имя и фамилия</label><input id="uName"></div><div class="formrow"><label>Email / логин</label><input id="uEmail"></div><div class="formrow"><label>Группа</label><select id="uGroup"><option>ИС-21</option><option>ИС-22</option><option>Преподаватели</option></select></div><div class="formrow"><label>Роль</label><select id="uRole"><option>Студент</option><option>Преподаватель</option><option>Администратор</option></select></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="saveUser()">Создать пользователя</button></div></div></div>`}function saveUser(){let name=document.getElementById('uName').value;if(!name){toast('Введите имя пользователя');return}db.users.push({name,email:document.getElementById('uEmail').value,group:document.getElementById('uGroup').value,role:document.getElementById('uRole').value,active:true});db.logs.push({text:`Создан пользователь ${name}`,time:new Date().toLocaleString('ru-RU')});save();closeModal();render();toast('Пользователь создан')}
function standsPage(){return `${head('Состояние стендов','Контроль виртуальных сред и лабораторных ресурсов.',`<button class="btn" onclick="toast('Состояние обновлено')">↻ Обновить</button>`)}<div class="grid stats">${[['Всего стендов','12'],['Активны','8'],['Свободны','3'],['С ошибкой','1']].map(x=>`<div class="card stat"><div class="statrow">${x[0]}</div><div class="statnum">${x[1]}</div><div class="delta">Изолированная среда</div></div>`).join('')}</div><div class="card section"><div class="tablewrap"><table class="table"><thead><tr><th>Стенд</th><th>Образ</th><th>Назначен</th><th>Состояние</th><th>Действия</th></tr></thead><tbody>${['lab-ubuntu-01','lab-cisco-04','lab-ubuntu-09','lab-ubuntu-12'].map((x,i)=>`<tr><td><b>${x}</b></td><td>${i===1?'Cisco IOSv':'Ubuntu Server 22.04'}</td><td>${['Илья Морозов','—','Анна Кузнецова','—'][i]}</td><td>${badge(i===3?'Ошибка':i===1?'Остановлен':'Активен')}</td><td><button class="btn" onclick="toast('${i===1?'Стенд запущен':'Стенд остановлен'}')">${i===1?'Запустить':'Остановить'}</button> <button class="btn" onclick="toast('Стенд сброшен к исходному состоянию')">Сбросить</button></td></tr>`).join('')}</tbody></table></div></div>`}
function systemLog(){let entries=db.logs.slice().reverse();return `${head('Системный журнал','История важных действий и изменений доступа.')}<div class="card section">${entries.length?`<div class="activity">${entries.map(e=>`<div class="event"><i class="eventdot"></i><div><p>${esc(e.text)}</p><small>${esc(e.time)}</small></div></div>`).join('')}</div>`:`<div class="empty">Системных событий пока нет.</div>`}</div>`}function groupsPage(){return `${head('Учебные группы','Состав групп и сводная информация по выполнению.') }<div class="grid twocol">${['ИС-21','ИС-22','Преподаватели'].map((g,i)=>`<div class="card section"><div class="sectiontitle"><h3>${g}</h3><span class="badge blue">${[24,24,3][i]} участников</span></div><p class="sub">${i<2?'Системное администрирование · 2026/27':'Преподавательский состав'}</p><div class="checkrow"><span>Активные задания</span><b>${[5,4,12][i]}</b></div><div class="checkrow"><span>Средний прогресс</span><b>${[68,54,100][i]}%</b></div><button class="textlink" onclick="toast('Список участников группы '+ '${g}')">Открыть группу →</button></div>`).join('')}</div>`}
if(localStorage.getItem('praktikum_theme')==='dark')document.body.classList.add('dark');document.getElementById('roleSelect').addEventListener('change',e=>setRole(e.target.value));if(!sessionStorage.getItem('praktikum_auth'))document.getElementById('auth').style.display='grid';else document.getElementById('auth').style.display='none';localStorage.setItem('praktikum_task_count',db.tasks.length);render();
</script></body></html>
